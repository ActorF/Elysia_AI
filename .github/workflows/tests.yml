# Enforce documentation, contracts, types, tests, and builds across supported hosts.
name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python documentation coverage
        run: python scripts/check_python_documentation.py

      - name: Check distribution asset boundary
        run: python scripts/check_distribution_assets.py

      - name: Run tests
        run: python -m pytest -v

      - name: Run Windows-targeted Python type checks
        run: >-
          python -m mypy --platform win32
          agent attachments chats config core desktop_protocol documents image_generation knowledge_lifecycle localization memory models project_sources projects recovery
          scripts ui voice work_tools desktop_backend.py desktop_knowledge.py desktop_speech.py desktop_work.py desktop_work_plans.py start.py

  windows-native-integration:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $hasParseFailure = $false
          foreach ($sourcePath in @(git ls-files -- '*.ps1' '*.psm1')) {
            $sourceTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $sourcePath).Path,
              [ref] $sourceTokens,
              [ref] $parseErrors
            ) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Host "::error file=$sourcePath::$($parseError.Message)"
              $hasParseFailure = $true
            }
          }
          if ($hasParseFailure) {
            throw 'PowerShell syntax validation failed.'
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Windows attachment and managed runtime integration
        run: >-
          python -m pytest -v
          tests/test_desktop_backend.py::test_attachment_add_returns_only_safe_canonical_metadata
          tests/test_windows_file_guard.py
          tests/test_work_workspace.py
          tests/test_work_mutations.py
          tests/test_work_writes.py
          tests/test_windows_managed_process.py
          tests/test_managed_gpt_sovits.py

      - name: Set up Node.js for package audit
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build unpacked Windows package
        working-directory: desktop
        run: npm run package

      - name: Verify native Vision decoding and synthetic window capture
        working-directory: desktop
        run: node --test tests/vision-image-native.test.mjs tests/vision-capture-synthetic.test.mjs

      - name: Capture ASAR file listing
        working-directory: desktop
        run: npx --no-install asar list out\win-unpacked\resources\app.asar > "%RUNNER_TEMP%\elysia-asar-listing.txt"

      - name: Extract reviewed ASAR tree
        run: |
          if exist "%RUNNER_TEMP%\elysia-asar-extracted" rmdir /s /q "%RUNNER_TEMP%\elysia-asar-extracted"
          call "%GITHUB_WORKSPACE%\desktop\node_modules\.bin\asar.cmd" extract "%GITHUB_WORKSPACE%\desktop\out\win-unpacked\resources\app.asar" "%RUNNER_TEMP%\elysia-asar-extracted"

      - name: Audit packaged distribution assets
        run: >-
          python scripts\check_distribution_assets.py
          --unpacked-tree desktop\out\win-unpacked
          --asar-listing "%RUNNER_TEMP%\elysia-asar-listing.txt"
          --extracted-asar-tree "%RUNNER_TEMP%\elysia-asar-extracted"

  desktop:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Set up Python for shared runner contract tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install shared runner dependencies
        run: python -m pip install -r ../requirements.txt

      - name: Check desktop documentation coverage
        run: npm run docs:check

      - name: Lint desktop sources
        run: npm run lint

      - name: Type-check desktop sources
        run: npm run typecheck

      - name: Run shared protocol contract tests
        run: npm run test:contract

      - name: Install the headless window manager
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openbox x11-utils

      - name: Run Electron renderer UI tests
        run: |
          # Xvfb supplies a display; native minimize/restore requires a window
          # manager as well. Prove that the manager owns this same display
          # before Electron launches instead of skipping those integration tests.
          xvfb-run --auto-servernum bash -euo pipefail <<'UI_SESSION'
          openbox --sm-disable >"$RUNNER_TEMP/elysia-openbox.log" 2>&1 &
          window_manager_pid=$!
          trap 'kill "$window_manager_pid" 2>/dev/null || true' EXIT
          window_manager_ready=false
          for readiness_attempt in {1..50}; do
            if ! kill -0 "$window_manager_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/elysia-openbox.log"
              exit 1
            fi
            window_manager_property="$(xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null || true)"
            if [[ "$window_manager_property" == *"window id #"* ]]; then
              window_manager_ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$window_manager_ready" != true ]]; then
            cat "$RUNNER_TEMP/elysia-openbox.log"
            exit 1
          fi
          npm run test:ui
          UI_SESSION

      - name: Build the desktop application
        run: npm run build
