name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Run Python type checks
        run: >-
          python -m mypy
          agent chats config core desktop_protocol memory projects recovery
          tools ui voice desktop_backend.py start.py

  desktop:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Lint desktop sources
        run: npm run lint

      - name: Type-check desktop sources
        run: npm run typecheck

      - name: Run shared protocol contract tests
        run: npm run test:contract

      - name: Run Electron renderer UI tests
        run: xvfb-run --auto-servernum npm run test:ui

      - name: Build the desktop application
        run: npm run build
