# Enforce documentation, contracts, types, tests, and builds across supported hosts.
name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python documentation coverage
        run: python scripts/check_python_documentation.py

      - name: Run tests
        run: python -m pytest -v

      - name: Run Windows-targeted Python type checks
        run: >-
          python -m mypy --platform win32
          agent attachments chats config core desktop_protocol memory models projects recovery
          scripts tools ui voice desktop_backend.py desktop_speech.py start.py

  windows-native-integration:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $hasParseFailure = $false
          foreach ($sourcePath in @(git ls-files -- '*.ps1' '*.psm1')) {
            $sourceTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $sourcePath).Path,
              [ref] $sourceTokens,
              [ref] $parseErrors
            ) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Host "::error file=$sourcePath::$($parseError.Message)"
              $hasParseFailure = $true
            }
          }
          if ($hasParseFailure) {
            throw 'PowerShell syntax validation failed.'
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Windows attachment and managed runtime integration
        run: >-
          python -m pytest -v
          tests/test_desktop_backend.py::test_attachment_add_returns_only_safe_canonical_metadata
          tests/test_windows_file_guard.py
          tests/test_windows_managed_process.py
          tests/test_managed_gpt_sovits.py

  desktop:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Check desktop documentation coverage
        run: npm run docs:check

      - name: Lint desktop sources
        run: npm run lint

      - name: Type-check desktop sources
        run: npm run typecheck

      - name: Run shared protocol contract tests
        run: npm run test:contract

      - name: Run Electron renderer UI tests
        run: xvfb-run --auto-servernum npm run test:ui

      - name: Build the desktop application
        run: npm run build
